<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Монитор Монтаж</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="monitor-montaj.js?v=1" defer></script>
  <style>
    .layout-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .window-header {
      padding: 10px 15px;
      font-size: 1.1em;
      font-weight: 900;
      letter-spacing: 1px;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
    }
    .window-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-content: flex-start;
    }
    .node-card {
      width: 300px !important;
      margin-bottom: 0 !important;
    }
    h1#monitorTitle {
      margin: 0;
      padding: 0;
      font-size: 24px;
      color: #fff;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div>Сглобяване на потока... ⚙️</div>
    <div id="error-box"></div>
  </div>
  
  <div class="layout-wrapper">
    <h1 id="monitorTitle">Монитор Монтаж</h1>
    
    <div class="lane" id="lane-resolvers" style="flex: 1; display: flex; flex-direction: column;">
      <div class="window-header" style="border-top: 3px solid #3b82f6; background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, transparent 100%);">
        РЕЗОЛВЕРИ
      </div>
      <div class="window-body" id="w-resolvers" style="flex: 1; padding-bottom: 50px;"></div>
    </div>
  </div>

</body>
</html>
