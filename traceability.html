<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИС-СИСТЕМС - Проследимост (Traceability)</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    /* CSS Variables & Global Reset (Dark Theme) */
    :root {
      --bg-light: #0f172a;
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --header-bg: #020617;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { margin: 0; padding: 0; height: 100vh; background-color: var(--bg-light); color: var(--text-main); overflow: hidden; }

    /* Top Navigation */
    .navbar {
      height: 60px;
      background-color: var(--header-bg);
      display: flex;
      align-items: center;
      padding: 0 20px;
      color: white;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .brand { font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    
    .search-container { display: flex; align-items: center; gap: 10px; margin-left: 30px; }
    .search-input { 
      padding: 8px 15px; 
      border-radius: 20px; 
      border: 1px solid #475569; 
      background: #0f172a; 
      color: white; 
      width: 300px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); background: #1e293b; }
    .search-btn {
      background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: 600;
    }
    .search-btn:hover { background: var(--primary-hover); }

    .nav-right { display: flex; align-items: center; gap: 15px; }
    .btn-back { background: transparent; border: 1px solid #64748b; color: #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .btn-back:hover { background: #334155; color: white; }

    /* Main Layout */
    .main-layout {
      display: flex;
      height: calc(100vh - 60px);
      padding: 15px;
      gap: 15px;
    }

    /* Side Panel - Tasks & Status */
    .side-panel {
      width: 320px;
      background: var(--panel-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 15px;
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .panel-content { padding: 15px; overflow-y: auto; flex: 1; }
    
    .task-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .task-card .task-title { font-weight: bold; margin-bottom: 5px; font-size: 0.95rem; color: #f8fafc; }
    .task-card .task-stats { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    
    .logs-btn {
      width: 100%; padding: 10px; background: #0f172a; border: 1px dashed #475569; color: var(--text-muted); border-radius: 8px; cursor: pointer; margin-top: 10px;
    }
    .logs-btn:hover { background: #334155; color: var(--text-main); }

    /* Main Panel Layout */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 0;
    }

    /* Top Monitor View */
    .tree-container {
      flex: 1;
      background: var(--panel-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .tree-workspace {
      flex: 1;
      overflow: auto;
      display: flex;
      padding: 40px;
      position: relative;
      /* Background grid pattern */
      background-image: radial-gradient(#334155 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .tree-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: min-content;
      min-height: min-content;
      margin: auto;
    }

    /* Tree Nodes */
    .node-col { display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 2;}
    .node-spacer { width: 100px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1;}
    
    .connection-line {
      height: 2px;
      width: 100%;
      background: #475569;
      position: relative;
    }
    .connection-line::after {
      content: ''; position: absolute; right: 0; top: -4px;
      border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid #475569;
    }
    
    .line-label {
      position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
      background: var(--panel-bg); padding: 2px 6px; border-radius: 10px; font-size: 0.75rem; border: 1px solid var(--border-color); font-weight: bold; color: var(--success);
    }

    .node {
      background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px; width: 180px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); text-align: center; overflow: hidden; transition: transform 0.2s;
    }
    .node:hover { transform: translateY(-2px); border-color: #64748b; }
    
    .node.main-node { border: 2px solid var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); width: 220px; }
    .node.main-node .node-header { background: var(--primary); color: white; border-bottom: none; }
    
    .node-header { padding: 10px; background: #0f172a; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e2e8f0; }
    .node-body { padding: 15px 10px; }
    .node-stat { font-size: 1.5rem; font-weight: 800; color: #f8fafc; margin-bottom: 5px; }
    .node-sub { font-size: 0.8rem; color: var(--text-muted); }

    /* Bottom Timeline */
    .timeline-container {
      height: 180px;
      background: var(--panel-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }
    
    .timeline-scroll {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 20px;
      display: flex;
      align-items: center;
      position: relative;
    }
    
    .timeline-track {
      height: 4px;
      background: #334155;
      width: max-content;
      min-width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 100px;
      gap: 100px;
    }
    
    .timeline-point {
      position: relative;
      cursor: pointer;
      z-index: 2;
    }
    
    .point-dot {
      width: 16px; height: 16px; border-radius: 50%; background: var(--panel-bg); border: 3px solid #64748b; transition: all 0.2s;
    }
    
    .timeline-point:hover .point-dot { border-color: var(--primary); transform: scale(1.2); }
    
    .timeline-point.active .point-dot { border-color: var(--primary); background: var(--primary); box-shadow: 0 0 0 4px rgba(59,130,246,0.3); }
    
    .point-date {
      position: absolute; top: 25px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-weight: bold; font-size: 0.85rem; color: #cbd5e1;
    }
    
    .point-info {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 0.8rem; background: #0f172a; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border-color); color: var(--success); font-weight: bold;
    }

  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="navbar">
    <div class="nav-left">
      <div class="brand">
        <img src="icon.png" style="height: 28px; border-radius: 4px;" onerror="this.style.display='none'"> 
        ПРОСЛЕДИМОСТ (TRACEABILITY)
      </div>
      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Сканирай или въведи ID на детайл...">
        <button class="search-btn" onclick="startSearch()">Търси</button>
      </div>
    </div>
    <div class="nav-right">
      <span id="selectedDateDisplay" style="color: #94a3b8; font-size: 0.9rem; margin-right: 15px;">
        <script>document.write("Днес: " + new Date().toLocaleDateString('bg-BG'));</script>
      </span>
      <a href="admin.html" class="btn-back">⬅ Обратно в Админ</a>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="main-layout">
    
    <!-- Main Panel -->
    <div class="main-panel">
      
      <!-- Top Monitor View (BOM Tree) -->
      <div class="tree-container">
        <div class="panel-header" style="position: absolute; top:0; left:0; right:0; z-index: 10; background: rgba(30,41,59,0.8); backdrop-filter: blur(4px);">
          <span>Дърво на проследимостта (Входове ➡️ Процес ➡️ Изходи)</span>
          <div>
            <select style="padding:4px 8px; border-radius:6px; border:1px solid var(--border-color); outline:none; font-size:0.85rem; background: var(--bg-light); color: var(--text-main);">
              <option value="1">Суровини: Само преки деца</option>
              <option value="all">Суровини: Пълна дълбочина</option>
            </select>
          </div>
        </div>

        <div class="tree-workspace" id="treeWorkspace">
          <div class="tree-wrapper" id="treeWrapper">
            <!-- Placeholder content -->
            <div style="color: var(--text-muted); font-size: 1.2rem;" id="treePlaceholder">
              Въведете детайл за визуализация...
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Timeline -->
      <div class="timeline-container">
        <div class="panel-header">
          <span>Хронология по дни (Движение на количествата)</span>
        </div>
        <div class="timeline-scroll">
          <div class="timeline-track" id="timelineTrack">
             <div style="color:var(--text-muted); margin: 0 auto;">Няма заредени данни...</div>
          </div>
        </div>
      </div>

    </div>

    <!-- Side Panel (Tasks & Status) -->
    <div class="side-panel">
      <div class="panel-header">
        <span>Активни Задачи</span>
        <span style="font-size: 0.8rem; background: #0f172a; padding: 2px 8px; border-radius: 12px; color: #94a3b8;" id="lblTargetId">Няма избран</span>
      </div>
      <div class="panel-content" id="tasksContainer">
        <!-- Placeholder content -->
        <div style="text-align:center; color:var(--text-muted); margin-top: 50px;">
          <div style="font-size: 3rem; margin-bottom: 10px;">🔍</div>
          <div>Моля, потърсете детайл, за да видите свързаните задачи.</div>
        </div>
      </div>
      <div style="padding: 15px; border-top: 1px solid var(--border-color); background: var(--panel-bg);">
        <button class="logs-btn">📄 Покажи суровите отчети</button>
      </div>
    </div>


  </div>

  <!-- Dummy elements for terminal-tasks.js to prevent crashing -->
  <div id="bigLoginScreen" style="display:none"></div>
  <div id="mainAppContent" style="display:none"></div>
  <div id="uiMachineName" style="display:none"></div>
  <div id="filter_all" style="display:none"></div>

  <script src="admin/admin-config.js"></script>
  <script src="terminal/terminal-tasks.js"></script>
  <script src="traceability.js"></script>
</body>
</html>
