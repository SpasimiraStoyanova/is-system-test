<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализи и Справки</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="statistics.js?v=2" defer></script>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Sofia Sans', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    /* Header */
    .header {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      flex: 0 0 auto;
    }
    .header-title {
      font-size: 1.5em;
      font-weight: 900;
      margin: 0;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .filters {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .filters label {
      font-weight: 600;
      color: #94a3b8;
    }
    .filters input[type="date"] {
      padding: 8px 12px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #f8fafc;
      font-family: 'Sofia Sans', sans-serif;
      font-size: 1em;
      outline: none;
    }
    .btn-apply {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    .btn-apply:hover { background: #0ea5e9; }
    
    /* Content Area */
    .content-area {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    
    /* KPI Cards */
    .kpi-container {
      display: flex;
      gap: 20px;
      flex: 0 0 auto;
    }
    .kpi-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
    }
    .kpi-title {
      font-size: 0.9em;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .kpi-value {
      font-size: 2em;
      font-weight: 900;
      color: #f8fafc;
    }
    .kpi-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3em;
      opacity: 0.1;
    }
    
    /* Timeline Container */
    .timeline-wrapper {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
      min-height: 500px;
    }
    .timeline-header {
      font-size: 1.2em;
      font-weight: 900;
      margin-bottom: 15px;
      color: #f8fafc;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #timeline-container {
      width: 100%;
      overflow-x: auto;
    }
    #timeline-div {
      min-width: 2000px; /* Forces horizontal scroll to prevent squishing */
      height: 100%;
    }
    
    #loading {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(15,23,42,0.9);
      color: #38bdf8;
      font-size: 1.5em;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    /* Table styles */
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      color: #f8fafc;
      font-size: 1.1em;
    }
    .summary-table th {
      text-align: left;
      padding: 12px;
      border-bottom: 2px solid #334155;
      color: #94a3b8;
      font-weight: 600;
    }
    .summary-table td {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .summary-table tr:hover td {
      background: rgba(255,255,255,0.05);
    }
    
    /* Google Charts customizations for dark mode */
    rect[fill="#ffffff"] { fill: #1e293b !important; } /* background */
    text { font-family: 'Sofia Sans', sans-serif !important; fill: #cbd5e1 !important; }
    path[stroke="#e6e6e6"] { stroke: #334155 !important; }
  </style>
</head>
<body>

  <div id="loading">Зареждане на данни... ⚙️</div>

  <div class="header">
    <h1 class="header-title">📊 Анализи и Справки</h1>
    <div class="filters">
      <label for="date-from">От:</label>
      <input type="date" id="date-from">
      
      <label for="date-to">До:</label>
      <input type="date" id="date-to">
      
      <button class="btn-apply" onclick="fetchAndRenderData()">Приложи филтър</button>
    </div>
  </div>

  <div class="content-area">
    
    <!-- KPI Cards -->
    <div class="kpi-container">
      <div class="kpi-card" style="border-bottom: 4px solid #10b981;">
        <div class="kpi-title">Общо изработени бройки</div>
        <div class="kpi-value" id="kpi-qty">0 бр.</div>
        <div class="kpi-icon">⚙️</div>
      </div>
      
      <div class="kpi-card" style="border-bottom: 4px solid #f59e0b;">
        <div class="kpi-title">Общо отчетено време</div>
        <div class="kpi-value" id="kpi-time">0 ч. 0 мин.</div>
        <div class="kpi-icon">⏱️</div>
      </div>
      
    </div>
    
    <div style="display: flex; gap: 20px; flex-direction: row; margin-top: 20px; flex-wrap: wrap;">
      <!-- Summary Table -->
      <div class="timeline-wrapper" style="flex: 1; min-width: 350px; max-width: 500px;">
        <div class="timeline-header">
          <span>Справка по Детайли</span>
        </div>
        <table class="summary-table" style="font-size: 1em;">
          <thead>
            <tr>
              <th>Детайл</th>
              <th>Операция</th>
              <th>Бройки</th>
              <th>Време</th>
            </tr>
          </thead>
          <tbody id="summary-tbody">
            <!-- Rows will be injected here -->
          </tbody>
        </table>
      </div>

      <!-- Gantt / Timeline -->
      <div class="timeline-wrapper" style="flex: 2; min-width: 600px;">
        <div class="timeline-header">
          <span>Времева Линия (Gantt) на Операторите (Скролни настрани ➔)</span>
        </div>
        <div id="timeline-container">
          <div id="timeline-div"></div>
        </div>
      </div>
    </div>
    
  </div>

</body>
</html>
