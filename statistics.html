<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализи и Справки</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="statistics.js?v=8" defer></script>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Sofia Sans', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    /* Header */
    .header {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      flex: 0 0 auto;
    }
    .header-title {
      font-size: 1.5em;
      font-weight: 900;
      margin: 0;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .filters {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .filters label {
      font-weight: 600;
      color: #94a3b8;
    }
    .filters input[type="date"] {
      padding: 8px 12px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #f8fafc;
      font-family: 'Sofia Sans', sans-serif;
      font-size: 1em;
      outline: none;
    }
    .btn-apply {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    .btn-apply:hover { background: #0ea5e9; }
    
    /* Content Area */
    .content-area {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    
    /* KPI Cards */
    .kpi-container {
      display: flex;
      gap: 20px;
      flex: 0 0 auto;
    }
    .kpi-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
    }
    .kpi-title {
      font-size: 0.9em;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .kpi-value {
      font-size: 2em;
      font-weight: 900;
      color: #f8fafc;
    }
    .kpi-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3em;
      opacity: 0.1;
    }
    
    /* Timeline Container */
    .timeline-wrapper {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
      min-height: 500px;
    }
    .timeline-header {
      font-size: 1.2em;
      font-weight: 900;
      margin-bottom: 15px;
      color: #f8fafc;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #timeline-div {
      height: 100%;
    }
    
    #loading {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(15,23,42,0.9);
      color: #38bdf8;
      font-size: 1.5em;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    /* Table styles */
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      color: #f8fafc;
      font-size: 1.1em;
    }
    .summary-table th {
      text-align: left;
      padding: 12px;
      border-bottom: 2px solid #334155;
      color: #94a3b8;
      font-weight: 600;
    }
    .summary-table td {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .summary-table tr:hover td {
      background: rgba(255,255,255,0.05);
    }
    
    /* Google Charts customizations for dark mode */
    rect[fill="#ffffff"] { fill: #1e293b !important; } /* background */
    text { font-family: 'Sofia Sans', sans-serif !important; fill: #cbd5e1 !important; }
    path[stroke="#e6e6e6"] { stroke: #334155 !important; }
    
    .btn-preset {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.82em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-preset:hover, .btn-preset.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <div id="loading">Зареждане на данни... ⚙️</div>

  <div class="header">
    <h1 class="header-title">📊 Анализи и Справки</h1>
    <div class="filters">
      <div style="display: flex; gap: 4px; align-items: center; margin-right: 5px;">
        <button type="button" class="btn-preset" onclick="setQuickDate('today')">Днес</button>
        <button type="button" class="btn-preset" onclick="setQuickDate('week')">Седмица</button>
        <button type="button" class="btn-preset" onclick="setQuickDate('month')">Месец</button>
        <button type="button" class="btn-preset" onclick="setQuickDate('all')">🌐 Цялата история</button>
      </div>

      <label for="date-from">От:</label>
      <input type="date" id="date-from">
      
      <label for="date-to">До:</label>
      <input type="date" id="date-to">
      
      <label for="operator-filter">Служител:</label>
      <select id="operator-filter" onchange="applyOperatorFilter()" style="padding: 7px 12px; background: #334155; border: 1px solid #475569; border-radius: 4px; color: #f8fafc; font-family: 'Sofia Sans', sans-serif; font-size: 0.95em; outline: none; cursor: pointer;">
        <option value="ALL">Всички служители</option>
      </select>
      
      <button class="btn-apply" onclick="fetchAndRenderData()">Приложи филтър</button>
      <button class="btn-apply" onclick="exportStatsToExcel()" style="background:#10b981; color:white;" title="Свали справката в Excel">📥 Excel</button>
    </div>
  </div>

  <div class="content-area">
    
    <div style="display: flex; gap: 20px; flex-direction: row; margin-top: 0px; flex-wrap: wrap;">
      <!-- Summary Table -->
      <div class="timeline-wrapper" style="flex: 1.2; min-width: 380px; max-width: 650px;">
        <div class="timeline-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span>Справка Нормовремена</span>
          <div style="display: flex; gap: 6px; font-size: 0.75em; text-transform: none;">
            <button id="btnViewDetail" onclick="setViewMode('detail')" style="background: #38bdf8; color: #0f172a; border: none; padding: 5px 10px; border-radius: 4px; font-weight: 800; cursor: pointer;">Обобщено</button>
            <button id="btnViewOperator" onclick="setViewMode('operator')" style="background: #334155; color: #94a3b8; border: none; padding: 5px 10px; border-radius: 4px; font-weight: 800; cursor: pointer;">По служители</button>
          </div>
        </div>

        <!-- Live Search Box with Scope Toggle -->
        <div style="display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap;">
          <div style="position: relative; flex: 1; min-width: 200px;">
            <input type="text" id="detailSearchInput" oninput="onDetailSearchInput()" onkeydown="if(event.key==='Enter') executeDetailSearch()" placeholder="🔍 Търси детайл (напр. Статор X-J)..." style="width: 100%; box-sizing: border-box; padding: 8px 32px 8px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #f8fafc; font-family: inherit; font-size: 0.9em; outline: none;">
            <button id="btnClearSearch" onclick="clearDetailSearch()" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; font-size: 14px; cursor: pointer; display: none;" title="Изчисти търсенето">✖</button>
          </div>
          <div style="display: flex; gap: 2px; background: #0f172a; padding: 2px; border-radius: 6px; border: 1px solid #334155;">
            <button type="button" id="btnScopePeriod" onclick="setSearchScope('period')" style="padding: 6px 10px; border: none; border-radius: 4px; font-weight: 800; font-size: 0.78em; cursor: pointer; background: #38bdf8; color: #0f172a;" title="Търси само в избрания период от дати">📅 В периода</button>
            <button type="button" id="btnScopeAll" onclick="setSearchScope('all')" style="padding: 6px 10px; border: none; border-radius: 4px; font-weight: 800; font-size: 0.78em; cursor: pointer; background: transparent; color: #94a3b8;" title="Търси в цялата история от създаването на системата">🌐 Цялата история</button>
          </div>
        </div>

        <div id="searchBadgeInfo" style="display: none; margin-bottom: 10px; padding: 7px 12px; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 6px; font-size: 0.85em; color: #38bdf8; display: flex; justify-content: space-between; align-items: center;">
          <span id="searchBadgeText"></span>
          <button type="button" onclick="clearDetailSearch()" style="background: none; border: none; color: #38bdf8; cursor: pointer; text-decoration: underline; font-weight: 700; font-size: 0.85em;">Покажи всички</button>
        </div>
        <table class="summary-table" style="font-size: 0.95em;">
          <thead id="summary-thead">
            <tr>
              <th>Детайл</th>
              <th>Операция</th>
              <th>Бройки</th>
              <th>Общо време</th>
              <th>Средно / Норма</th>
            </tr>
          </thead>
          <tbody id="summary-tbody">
            <!-- Rows will be injected here -->
          </tbody>
        </table>
      </div>

      <!-- Gantt / Timeline -->
      <div class="timeline-wrapper" style="flex: 2 1 400px; min-width: 0; overflow-x: auto;">
        <div class="timeline-header">
          <span>Времева Линия (Gantt) на Операторите (Скролни настрани ➔)</span>
        </div>
        <div id="timeline-div"></div>
      </div>
    </div>
    
  </div>

</body>
</html>
