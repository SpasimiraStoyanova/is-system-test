<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жив Монитор на Производството</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=35" defer></script>
</head>
<body>

  <div id="loading">
    <div>Сглобяване на VSM потока... ⚙️</div>
    <div id="error-box"></div>
  </div>
  
  <svg id="svg-overlay"></svg>

  <!-- ТВ ЛЕНТА С КОНТРОЛИ (ФУЛСКРИЙН, МАЩАБИРАНЕ, ПОСЛЕДНО ОБНОВЯВАНЕ) -->
  <div class="tv-control-bar">
    <div id="tv-last-sync" class="tv-status-badge">🔄 Зареждане...</div>
    <div class="tv-zoom-actions">
      <button class="tv-btn" id="btn-zoom-out" title="Намали шрифта (A-)">A-</button>
      <span id="tv-zoom-val" class="tv-zoom-indicator" title="Възстанови 100%">100%</span>
      <button class="tv-btn" id="btn-zoom-in" title="Увеличи шрифта (A+)">A+</button>
      <button class="tv-btn" id="btn-fullscreen" title="Цял екран (F11)">⛶</button>
    </div>
  </div>

  <div class="layout-wrapper" id="dashboard-wrapper">
    <!-- ГОРЕН РЕД: ТЕЛА (ВЛЯВО), ПРЕДНИ И ЗАДНИ КАПАЦИ (В СРЕДАТА ЕДИН НАД ДРУГ), МПР (ВДЯСНО - ШИРОК) -->
    <div class="row-section top-row">
      <!-- ТЕЛА -->
      <div class="window window-tiela">
        <div class="window-header header-tiela">ТЕЛА</div>
        <div class="window-body" id="w-tiela"></div>
      </div>

      <!-- СРЕДНА КОЛОНА: ПРЕДНИ И ЗАДНИ КАПАЦИ ЕДИН НАД ДРУГ -->
      <div class="caps-stack-zone">
        <div class="window window-predni">
          <div class="window-header header-predni">ПРЕДНИ КАПАЦИ</div>
          <div class="window-body" id="w-predni"></div>
        </div>
        <div class="window window-zadni">
          <div class="window-header header-zadni">ЗАДНИ КАПАЦИ</div>
          <div class="window-body" id="w-zadni"></div>
        </div>
      </div>

      <!-- МПР (ШИРОК ПРОЗОРЕЦ, ЗА ДА НЕ СЕ ОТРЯЗВАТ ВЕРИГИТЕ) -->
      <div class="window window-mpr">
        <div class="window-header header-mpr">МПР</div>
        <div class="window-body" id="w-mpr"></div>
      </div>
    </div>
    
    <!-- ДОЛЕН РЕД: РОТОРИ ВЛЯВО (ШИРОК), СТАТОРИ И РЕЗОЛВЕРИ ВДЯСНО (ЕДИН НАД ДРУГ) -->
    <div class="row-section bottom-row">
      <!-- ЛЯВА ЗОНА: РОТОРИ - ВАЛОВЕ - ЛАГЕРНИ ВЪЗЛИ -->
      <div class="window window-rotors">
        <div class="window-header header-rotors">РОТОРИ - ВАЛОВЕ - ЛАГЕРНИ ВЪЗЛИ</div>
        <div class="window-body" id="w-rotors-body">
          <div class="lane"><span class="lane-title">ВАР. 11</span><div id="w-var11"></div></div>
          <div class="lane"><span class="lane-title">ВАР. 25</span><div id="w-var25"></div></div>
          <div class="lane" style="margin-top: 14px;"><span class="lane-title">ЩИФТОВЕ</span><div id="w-small-pins"></div></div>
          <div class="lane"><span class="lane-title">ЛАГЕРНИ ВЪЗЛИ</span><div id="w-bearings"></div></div>
        </div>
      </div>

      <!-- ДЯСНА ЗОНА: СТАТОРИ И РЕЗОЛВЕРИ ЕДИН НАД ДРУГ -->
      <div class="right-stack-zone">
        <div class="window window-statori">
          <div class="window-header header-statori">СТАТОРИ И ТРАНСФОРМАТОРИ</div>
          <div class="window-body" id="w-statori"></div>
        </div>
        
        <div class="window window-assembly">
          <div class="window-header header-assembly">РЕЗОЛВЕРИ</div>
          <div class="window-body" id="w-assembly"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- НЕВИДИМИ БУФЕРИ ЗА ДЕТАЙЛИ, КОИТО СЕ ПРЕРАЗПРЕДЕЛЯТ ЧРЕЗ APP.JS -->
  <div style="display: none;">
    <div id="w-small-studs"></div>
    <div id="w-small-rotors"></div>
    <div id="w-small-others"></div>
    <div id="w-small-spools"></div>
    <div id="w-temp-rotors-11"></div>
    <div id="w-temp-rotors-25"></div>
  </div>
</body>
</html>
