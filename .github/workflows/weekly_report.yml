name: Weekly Executive Report

on:
  schedule:
    # Runs Monday morning at 04:30 UTC (06:30 EET Bulgarian Time in winter / 07:30 EEST in summer)
    # Running early morning completely avoids GitHub Actions peak queue delays so the report is guaranteed in your inbox before 08:30 AM
    - cron: '30 4 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send Weekly Report via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: 'sstoyanova.amci@gmail.com'
        run: node scripts/send_weekly_report.js