name: Weekly Executive Report

on:
  schedule:
    # Runs early Monday morning at 03:15 UTC (06:15 EEST / 05:15 EET Bulgarian Time)
    # Shifting earlier avoids GitHub Actions peak queue delays so email arrives around 07:30 - 08:00 AM
    - cron: '15 3 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send Weekly Report via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: 'sstoyanova.amci@gmail.com'
        run: node scripts/send_weekly_report.js