name: Weekly Executive Report

on:
  schedule:
    # Runs Monday morning at 07:45 UTC (09:45 EET Bulgarian Time in winter / 10:45 EEST in summer)
    # Using an off-hour minute (:45) minimizes GitHub Actions queue latency so email arrives around 10:00 AM
    - cron: '45 7 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send Weekly Report via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: 'sstoyanova.amci@gmail.com'
        run: node scripts/send_weekly_report.js